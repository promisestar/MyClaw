  # H. 任务与编排（4）
  # ═══════════════════════════════════════════════════════════════════

  - id: task_create_multi_step
    title: 用 task 工具拆解并跟踪任务
    mode: craft
    message: >
      请用任务工具把这件事拆成 3 个子任务并登记：
      1) 修 src/utils.py 的折扣计算；2) 更新 CHANGELOG；3) 更新 docs/architecture.md。
      登记后列出所有任务，告诉我当前进度。
    expect:
      require_tools: [task]
      min_done_chars: 20
    tags: [core, orchestration]
    judge:
      enabled: true
      weights: {task_completion: 0.30, trajectory_quality: 0.30, tool_efficiency: 0.20, response_quality: 0.15, error_recovery: 0.05}
      rubric: |
        好：拆解出的步骤粒度合理、顺序正确、覆盖完整。
        存在步骤遗漏或顺序颠倒，task_completion 不超过 3 分。

  - id: subagent_spawn_readonly
    title: 派生子代理做只读调研
    mode: craft
    timeout_s: 240
    message: >
      请派生一个子代理（subagent），让它只读地调研 notes/ 与 docs/ 下的文档，
      汇总「这个工作区有哪些约定」，再把子代理的结论整理成中文回复给我。
    expect:
      require_tools: [subagent]
      min_done_chars: 40
    tags: [core, orchestration]

  - id: subagent_parallel_spawn
    title: 并行派生多个子代理
    mode: craft
    timeout_s: 300
    message: >
      请用 subagent 的 parallel_spawn 并行跑两件事：
      一是总结 data/sales.csv 的销售情况，二是总结 docs/architecture.md 的架构约定。
      最后合并两路结果给我。
    expect:
      require_tools: [subagent]
      min_done_chars: 40
    tags: [core, orchestration]
    judge:
      enabled: true
      weights: {tool_efficiency: 0.30, task_completion: 0.30, trajectory_quality: 0.25, error_recovery: 0.10, response_quality: 0.05}
      rubric: |
        好：将可并行的子任务拆分给多个子代理并发执行，最后汇总结论。
        本可并行却串行执行，tool_efficiency 不超过 3 分。
        子代理失败未重试、或未在最终汇总中体现，error_recovery 扣分。

  - id: automation_create_and_list
    title: 创建并列出定时任务
    mode: craft
    message: >
      请创建一个定时任务：每个工作日早上 9 点，用 rrule 调度，
      内容是「汇总 data/sales.csv 的昨日销售额」。创建成功后列出所有定时任务。
    expect:
      require_tools: [automation]
      min_done_chars: 20
    tags: [core, orchestration]
    judge:
      enabled: false

  # ═══════════════════════════════════════════════════════════════════
  # I. 联网与浏览器（5）
  # ═══════════════════════════════════════════════════════════════════

  - id: web_search_news
