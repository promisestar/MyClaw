  # ═══════════════════════════════════════════════════════════════════
  # F. 记忆与跨会话回忆（4）
  # ═══════════════════════════════════════════════════════════════════

  - id: memory_add_preference
    title: Craft 写入长期记忆
    mode: craft
    message: >
      请记住我的编码偏好：所有代码注释使用中文，回复保持简洁不啰嗦。
      请用记忆工具存下来，并确认已保存。
    expect:
      require_any_tools: [memory_add, memory]
      min_done_chars: 15
    tags: [core, memory]

  - id: memory_search_recall
    title: 同会话内检索记忆
    mode: craft
    reuse_session_from: memory_add_preference
    message: >
      请检索长期记忆，告诉我刚才让你记住的编码偏好具体是什么。
    expect:
      require_any_tools: [memory_search, memory, session_search]
      min_done_chars: 30
    tags: [core, memory]

  - id: memory_cross_session_recall
    title: 新会话不靠上下文检索记忆
    mode: craft
    message: >
      这是一个全新的会话，不要依赖上文。请检索长期记忆，
      回答：我的代码注释语言偏好是什么？
    expect:
      require_any_tools: [memory_search, memory, session_search]
      min_done_chars: 20
    tags: [core, memory]
    judge:
      enabled: true
      weights: {response_quality: 0.35, task_completion: 0.35, trajectory_quality: 0.15, tool_efficiency: 0.10, error_recovery: 0.05}
      rubric: |
        好：能成功检索到此前存入的记忆，并据此作答。
        检索不到时应如实说明，而不是编造一个偏好——编造直接写入 red_flags 且 response_quality 记 1 分。

  - id: session_search_recall
    title: 跨会话原文回忆
    mode: craft
    message: >
      请用 session_search 在历史会话里查找「MyClaw 评测」相关的讨论，
      把找到的片段原文摘出来；没有命中就如实说明。
    expect:
      require_any_tools: [session_search, memory_search, memory]
      min_done_chars: 20
    tags: [core, memory, session]

  # ═══════════════════════════════════════════════════════════════════
  # G. RAG 知识库（3）
  # ═══════════════════════════════════════════════════════════════════

  - id: rag_add_text_then_search
    title: RAG 文本入库后检索命中
    mode: craft
    message: >
      把下面这段话存入知识库（命名空间 eval-notes）：
      「ContextGuard 按 output_size_hint 与窗口占用比决定 inline、snip 或 delegate；
      副作用工具永不被委托给子代理。」。
      入库后用 search 检索「上下文压缩」，确认能否命中原文片段。
    expect:
      require_any_tools: [rag]
      min_done_chars: 30
    tags: [core, rag]

  - id: rag_ask_question
    title: RAG 入库后用 ask 问答
    mode: craft
    message: >
      先用 rag 的 add_text 把 notes/design_notes.md 的核心内容存入命名空间 eval-notes，
      再用 rag 的 ask 提问：ContextGuard 在什么情况下会把工具输出委托给子代理？
    expect:
      require_any_tools: [rag]
      min_done_chars: 40
    tags: [core, rag]
    judge:
      enabled: true
      weights: {response_quality: 0.35, task_completion: 0.35, trajectory_quality: 0.15, tool_efficiency: 0.10, error_recovery: 0.05}
      rubric: |
        好：先确认文档已入库，再提问；回答应有文档依据。
        回答与文档内容不符（幻觉），response_quality 记 1 分并写入 red_flags。
        检索为空时应说明，而不是凭常识作答。

  - id: rag_stats_probe
    title: RAG 状态查询
    mode: craft
    message: >
      请用 rag 的 stats 查看 eval-notes 命名空间的入库状态（分块数、管道状态），
      并说明现在能不能检索。
    expect:
      require_any_tools: [rag]
      min_done_chars: 20
    tags: [core, rag]
    judge:
      enabled: false

