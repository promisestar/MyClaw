  # ═══════════════════════════════════════════════════════════════════
  # K. 健壮性与中断（2）
  # ═══════════════════════════════════════════════════════════════════

  - id: error_recovery_missing_file
    title: 文件不存在时优雅恢复
    mode: craft
    message: >
      请打开 does_not_exist.py，把它的 main 函数改成打印 hello。
      如果文件确实不存在，请如实说明并给出查找同名文件的建议。
    expect:
      require_any_tools: [Read, search_content, search_file]
      min_done_chars: 30
    tags: [core, robustness]
    judge:
      enabled: true
      weights: {error_recovery: 0.35, task_completion: 0.25, trajectory_quality: 0.20, tool_efficiency: 0.10, response_quality: 0.10}
      rubric: |
        这是错误恢复专项场景，error_recovery 权重最高。
        好：文件不存在时，应重试其它路径、用 list_dir / search_file 定位真实位置，
        或明确告知用户文件不存在并给出替代方案。
        直接编造文件内容、或一句话放弃且不给任何出路，error_recovery 应为 1 分。

  - id: cancel_mid_run
    title: 长任务执行中被用户取消
    mode: craft
    timeout_s: 120
    # runner 会在流式开始 N 秒后调用 POST /api/chat/cancel
    cancel_after_s: 10
    message: >
      请逐个精读 notes/ 与 docs/ 下的每一篇文档，为每篇写不少于 500 字的中文详读报告，
      最后汇总成 docs/reading_report.md 写入工作区。请务必逐篇展开，不要省略。
    expect:
      expect_cancelled: true
      min_done_chars: 0
    tags: [core, robustness]
    judge:
      enabled: true
      weights: {trajectory_quality: 0.35, task_completion: 0.25, response_quality: 0.15, tool_efficiency: 0.15, error_recovery: 0.10}
      rubric: |
        这是中途取消专项场景。被取消属预期行为，**不应因"没做完"扣分**。
        重点看：取消前是否有序推进、有无留下破坏工作区的半成品。
        task_completion 应基于「取消前的进展」而非「最终是否完成」来评分。

  # ═══════════════════════════════════════════════════════════════════
  # L. 上下文治理与对话降级（5）
  #    ContextGuard 决策：inline / snip（截断）/ delegate（委托子代理）
  #    参考 src/context/context_guard.py：
  #      LARGE_THRESHOLD=8000 tokens，超过则 delegate
  #      NO_DELEGATE_TOOLS 含 Write/Edit/memory_add/task/subagent/Skill/
  #      skill_manage/calculator/browser/automation —— 这些永不被委托
  #    注意：execute_command 不在 NO_DELEGATE 里，理论上允许被委托
  # ═══════════════════════════════════════════════════════════════════

  - id: guard_web_fetch_delegated
    title: 大输出工具触发自动委托
    mode: craft
    timeout_s: 240
    message: >
      请用网页抓取工具读取 https://example.com ，把拿到的完整正文告诉我。
      如果抓取工具的输出被系统自动转交给了子代理处理，请如实说明这一点。
    expect:
      require_any_tools: [web_fetch]
      min_done_chars: 30
    tags: [core, guard, net]
    judge:
      enabled: true
      weights: {task_completion: 0.35, response_quality: 0.30, trajectory_quality: 0.20, tool_efficiency: 0.10, error_recovery: 0.05}
      rubric: |
        重点观察 ContextGuard 是否把大输出工具（web_fetch 预估 8000 tokens，
        正好达到委托阈值）的返回自动委托给子代理。
        若结果出现「[自动委托给子代理」标记，说明委托链路生效，trajectory_quality 应给高分。
        委托是否发生取决于实际输出大小，未触发不算缺陷——不要因此扣分。
        但 agent 若声称委托了而轨迹中没有证据，response_quality 扣分并写入 red_flags。

  - id: guard_write_never_delegated
    title: 副作用工具永不被委托给子代理
    mode: craft
    message: >
      请在工作区新建一个文件 guard_probe.txt，内容为一行 "MyClaw guard probe"。
      写完后告诉我：这次写入是你自己执行的，还是被系统转交给了子代理？
    expect:
      require_any_tools: [Write, Edit]
      # ContextGuard 契约：Write/Edit 属于 NO_DELEGATE_TOOLS，绝不能出现委托标记
      forbid_result_contains_any: ["[自动委托给子代理"]
      min_done_chars: 20
    tags: [core, guard, safety]
    judge:
      enabled: false

  - id: guard_execute_command_delegated
    title: 命令执行允许被委托（对照场景）
    mode: craft
    message: >
      请在当前工作区执行一条会产生较多输出的命令（例如列出所有文件及其行数），
      把输出整理后告诉我。如果命令输出被系统转交给了子代理，请说明。
    expect:
      require_tools: [execute_command]
      min_done_chars: 20
    tags: [core, guard, safety]
    judge:
      enabled: true
      weights: {trajectory_quality: 0.35, task_completion: 0.30, response_quality: 0.20, tool_efficiency: 0.10, error_recovery: 0.05}
      rubric: |
        这是 guard_write_never_delegated 的对照场景。execute_command 不在
        NO_DELEGATE_TOOLS 中，因此其输出**允许**被委托给子代理。
        本场景不强制要求委托发生（取决于输出大小），重点看：
        agent 对"是否发生委托"的描述是否与轨迹事实一致。
        声称委托但无证据、或发生委托却否认，response_quality 扣分。

  - id: guard_read_large_file_snipped
    title: 读取超大文件时的截断行为
    mode: craft
    timeout_s: 240
    message: >
      请读取 data/large_log.txt（这是一个很大的日志文件），
      告诉我它一共有多少行、ERROR 级别的记录大概有多少条。
      如果内容太长被系统截断了，请如实说明你看到了多少、结论是基于多少数据得出的。
    expect:
      require_any_tools: [Read]
      min_done_chars: 40
    tags: [core, guard, robustness]
    judge:
      enabled: true
      weights: {response_quality: 0.35, task_completion: 0.30, trajectory_quality: 0.20, tool_efficiency: 0.10, error_recovery: 0.05}
      rubric: |
        大文件场景下最忌讳的是「看到一半却当成看到了全部」。
        好：能识别内容是否被截断/采样，并明确说明统计基于多少数据，不编造全量结论。
        未声明数据来源范围就给出精确行数，response_quality 不超过 2 分。
        声称"共 N 行"但轨迹里只读了一次且被截断，应写入 red_flags。
        用脚本统计（execute_command）而非硬读全文，属于合理的工具选择，应加分。

  - id: pure_chat_no_tool
    title: 纯闲聊不调用任何工具
    mode: craft
    message: >
      用一句话解释一下什么是「幂等性」，不需要查任何资料、不要动任何文件。
    expect:
      # 纯对话场景：不应触发任何工具调用
      min_done_chars: 20
    tags: [core, guard]
    judge:
      enabled: true
      weights: {tool_efficiency: 0.40, task_completion: 0.30, response_quality: 0.30, trajectory_quality: 0.00, error_recovery: 0.00}
      rubric: |
        这是"能不调工具就不调"的专项场景，tool_efficiency 权重最高。
        用户明确说不需要查资料、不要动文件，理想轨迹是零工具调用直接作答。
        明明不需要却去读文件、列目录或搜索，tool_efficiency 不超过 2 分。
        回答准确简洁即可，不要求长篇大论。


  # ═══════════════════════════════════════════════════════════════════
  # M. 任务管理 action 深度（5）
  #    task 工具 7 个 action：task_create / task_start / task_complete /
  #    task_fail / task_cancel / task_list / task_progress（带 task_ 前缀）
  #    现有 task_create_multi_step 只覆盖 create+list，这里补其余 action
  # ═══════════════════════════════════════════════════════════════════

  - id: task_start_and_progress
    title: 任务启动并查询进度
    mode: craft
    message: >
      请用任务工具登记一个任务「修复折扣计算 bug」（描述：src/utils.py 的
      calc_discount 符号错误），登记后把它标记为进行中，再查询一次任务进度，
      告诉我当前状态。
    expect:
      require_tools: [task]
      min_done_chars: 20
    tags: [core, orchestration]
    judge:
      enabled: true
      weights: {task_completion: 0.35, trajectory_quality: 0.30, tool_efficiency: 0.20, error_recovery: 0.10, response_quality: 0.05}
      rubric: |
        好：先用 task_create 登记，再用 task_start 标记进行中，最后 task_progress 查询。
        步骤顺序颠倒（未创建就 start）或漏掉进度查询，task_completion 扣分。

  - id: task_complete_then_list
    title: 完成任务并核对列表
    mode: craft
    message: >
      请登记两个任务「更新 CHANGELOG」和「更新架构文档」，登记后把第一个任务
      标记为已完成（备注"已更新 0.2.0 条目"），再列出全部任务，告诉我完成情况。
    expect:
      require_tools: [task]
      min_done_chars: 30
    tags: [core, orchestration]
    judge:
      enabled: true
