  - id: web_research_then_write_file
    title: 联网调研后落盘
    mode: craft
    message: >
      请联网检索「Agent 工具门控设计」的资料，
      把要点整理成中文，写入工作区的 research_notes.md。
    expect:
      require_any_tools: [web_search, web_fetch, http_request]
      result_contains_any: [research_notes]
      min_done_chars: 40
    tags: [core, net, craft]
    judge:
      enabled: true
      weights: {task_completion: 0.35, tool_efficiency: 0.25, trajectory_quality: 0.20, error_recovery: 0.10, response_quality: 0.10}
      rubric: |
        好：先联网检索获取事实，再落盘；写入内容应包含检索到的关键信息。
        未检索就凭既有知识写文件，task_completion 不超过 2 分。
        检索失败时应如实说明信息来源受限，而不是编造数据——编造写入 red_flags。

  # ═══════════════════════════════════════════════════════════════════
  # J. 技能与 MCP（3）
  # ═══════════════════════════════════════════════════════════════════

  - id: skill_load_explicit
