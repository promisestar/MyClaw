  - id: web_fetch_page
    title: 抓取网页正文
    mode: craft
    message: >
      请用网页抓取工具读取 https://example.com ，
      告诉我页面标题和正文第一段。
    expect:
      require_any_tools: [web_fetch]
      min_done_chars: 30
