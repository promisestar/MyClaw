      rubric: |
        好：入库时正确指定不同 namespace，检索时也限定同一 namespace，
        并验证内容隔离（eval-a 搜不到 eval-b 的内容）。
        命名空间混淆导致跨库串扰，response_quality 不超过 2 分。

  - id: rag_search_limit_score
    title: 带限制参数的检索
    mode: craft
