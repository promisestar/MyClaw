  # ═══════════════════════════════════════════════════════════════════
  # R. 记忆 action 深度（3）
  #    memory_search 支持 category 过滤（preference/decision/entity/fact/
  #    plan/relationship/reference/rule）。现有只覆盖 add + 无过滤 search
  # ═══════════════════════════════════════════════════════════════════

  - id: memory_category_filter
    title: 按分类过滤检索记忆
    mode: craft
    message: >
      请先写入两条不同分类的记忆：
      1) 「编码偏好：注释用中文」（category=preference）；
      2) 「决策：线上默认关闭 debug」（category=decision）。
      然后用 memory_search 只检索 preference 分类，告诉我命中了什么。
    expect:
      require_any_tools: [memory_add, memory, memory_search]
      min_done_chars: 30
    tags: [core, memory]
    judge:
      enabled: true
      weights: {task_completion: 0.35, response_quality: 0.30, trajectory_quality: 0.20, tool_efficiency: 0.10, error_recovery: 0.05}
      rubric: |
        好：写入时正确指定 category，检索时用 category 参数限定在 preference，
        只返回偏好类记忆而不混入 decision。
        分类写错或检索时未过滤，task_completion 不超过 3 分。

  - id: memory_multi_category_write
    title: 多分类记忆分别写入
    mode: craft
    message: >
      请分别写入三类记忆并明确标注分类：
      1) 事实：项目使用 Python 3.13（category=fact）；
      2) 偏好：回复保持简洁（category=preference）；
      3) 规则：破坏性操作需确认（category=rule）。
      写完后确认三条都已保存。
    expect:
      require_any_tools: [memory_add, memory]
      min_done_chars: 30
    tags: [core, memory]
    judge:
      enabled: false

  - id: memory_preference_update
    title: 记忆偏好更新与覆盖
    mode: craft
    message: >
      我之前可能存过「注释用中文」的偏好。现在请更新这条偏好为
      「注释用中文、变量命名用英文」，并用记忆工具保存，确认更新已生效。
    expect:
      require_any_tools: [memory_add, memory, memory_search]
      min_done_chars: 30
    tags: [core, memory]
    judge:
      enabled: true
      weights: {task_completion: 0.35, response_quality: 0.30, trajectory_quality: 0.20, tool_efficiency: 0.10, error_recovery: 0.05}
      rubric: |
        好：先检索是否已有相关偏好，再写入更新后的版本，形成"查→改→存"闭环。
        未查旧偏好就直接新增，可能导致新旧偏好并存矛盾，trajectory_quality 扣分。

  # ═══════════════════════════════════════════════════════════════════
