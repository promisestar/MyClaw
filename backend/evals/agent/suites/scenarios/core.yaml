    expect:
      require_tools: [task]
      min_done_chars: 20
    tags: [core, orchestration]
    judge:
      enabled: true
      weights: {task_completion: 0.35, trajectory_quality: 0.30, tool_efficiency: 0.20, error_recovery: 0.10, response_quality: 0.05}
      rubric: |
        好：task_fail 时带上明确的失败原因备注，而不是只标记失败不给说明。
        失败无原因备注，trajectory_quality 扣分。

  - id: task_cancel_task
    title: 取消任务
    mode: craft
    message: >
      请登记一个任务「重构 sample_app」，然后取消它，并确认取消后任务列表中
      它的状态已经变化。告诉我最终状态。
    expect:
      require_tools: [task]
      min_done_chars: 20
    tags: [core, orchestration]
    judge:
      enabled: true
      weights: {task_completion: 0.35, trajectory_quality: 0.30, tool_efficiency: 0.20, error_recovery: 0.10, response_quality: 0.05}
      rubric: |
        好：create → cancel → 回读确认状态变化，形成闭环。
        取消后不确认状态，task_completion 不超过 3 分。

  - id: task_dependency_dag
    title: 带依赖关系的任务拆解
    mode: craft
    message: >
      请登记三个有依赖关系的任务：
      1) 「修 src/utils.py 折扣 bug」；2) 「为修复写单元测试」（依赖任务 1）；
      3) 「更新 CHANGELOG」（依赖任务 1 和 2）。
      登记时用 depends_on 明确依赖，然后告诉我执行顺序。
    expect:
      require_tools: [task]
      min_done_chars: 40
    tags: [core, orchestration]
    judge:
      enabled: true
      weights: {task_completion: 0.35, trajectory_quality: 0.30, tool_efficiency: 0.20, error_recovery: 0.10, response_quality: 0.05}
      rubric: |
        好：用 depends_on 正确表达依赖（2 依赖 1，3 依赖 1 和 2），
        并据此给出正确的执行顺序（1 → 2 → 3）。
        依赖关系写错或顺序推导错误，trajectory_quality 不超过 2 分。

